spring.application.name=autohub-backend
server.port=8080

# ---------- SQL Server ----------
# Create the database and give springuser access first (see README section 1):
#   CREATE DATABASE AutoHubLankaDB;
#   USE AutoHubLankaDB; CREATE USER springuser FOR LOGIN springuser; ALTER ROLE db_owner ADD MEMBER springuser;
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AutoHubLankaDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=springuser
spring.datasource.password=SpringUser@12345#
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---------- JPA ----------
# Dialect set explicitly so a connection problem shows the real SQL Server error
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
app.jwt.secret=AutoHubLankaJwtSecretKeyForSparePartsSystem2026!
app.jwt.expiration-ms=86400000

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:5173

# ---------- Default accounts (created on first start) ----------
app.seed.enabled=true

# ---------- Google login ----------
# OAuth 2.0 Client ID (type "Web application") from https://console.cloud.google.com/apis/credentials
# Add http://localhost:5173 and http://localhost:8080 as "Authorised JavaScript origins".
# Paste it after the '=' below, or set the GOOGLE_CLIENT_ID environment variable.
# Until it is set, the "Continue with Google" button is shown greyed out with a "not set up yet" message.
app.google.client-id=${GOOGLE_CLIENT_ID:487498149013-0dl86beto97niunbpgroaajbrknlt55u.apps.googleusercontent.com}

# ---- uploads (the services check the real limits: profile picture 2 MB, bank slip 5 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
